[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hft-backend"
version = "0.1.0"
description = "FastAPI API and Celery worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    # Generated contract models (contracts_gen/) depend on Pydantic directly.
    "pydantic==2.14.2",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    # kombu[redis] (pulled in by celery[redis]) requires redis<6.5.
    "redis==6.4.0",
    "celery[redis]==5.6.3",
    # instructor 1.17 caps jiter<0.15; openai>=3.3.1 needs jiter>=0.16.
    "openai==3.3.0",
    "instructor==1.17.0",
    "docker==7.2.0",
    # dsa/taxonomy.yaml and seeds/*/concepts.yaml (profiler).
    "pyyaml==6.0.3",
    # Formatting-preserving code transforms for task builders (mutation, feature removal).
    "libcst==1.9.0",
    # Assistant output guard: similarity of hint code to the reference (P3.2 / F2).
    "copydetect==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
    "ruff==0.17.3",
    "jsonschema==4.26.0",
    "datamodel-code-generator==0.87.0",
    "fakeredis==2.40.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "assistant",
    "builder",
    "contracts_gen",
    "gate",
    "interviewer",
    "llm",
    "profiler",
    "report",
    "runner",
    "scoring",
    "trail",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker tests need the Docker socket (worker only): run them with `make test-docker`.
addopts = "-ra -m 'not docker'"
markers = ["docker: starts real sandbox containers (needs the Docker socket and `make runtimes`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by `make contracts`.
extend-exclude = ["contracts_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
